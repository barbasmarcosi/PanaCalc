name: quality

on:
  push:
    branches: ['main']
  workflow_dispatch:

# V2 development: PR-triggered CI is temporarily disabled to avoid one Actions run
# per connector-authored file commit. Re-enable pull_request before marking PR #2 ready.

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Preview build
        run: npm run build:preview
